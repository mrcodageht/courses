name: Build and deploy courses docs

env:
  HOST: vpn
  SECRET_KEY: ${{ secrets.SSH_KEY_VPS }}
  USER_VPS: ${{ vars.VPS_USER }}
  DEST_PATH: /home/${{ vars.VPS_USER }}

on: 
  push: 
    branches: [docs]
    
permissions:
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ghcr.io/mrcodageht/${{ github.repository }}/docs
    steps:
      - name: recuperation du code
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_PACKAGES_GITHUB }}
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_TAG }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
    
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: recuperation du code
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_PACKAGES_GITHUB }}
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{secrets.TS_OAUTH_CLIENT_SECRET}}
          tags: tag:workflow
        
      - name: checkout du repo
        uses: actions/checkout@v6

      - uses: mrcodageht/courses/.github/actions/deploy@main
        with:
          host: $HOST
          secret-key: $SECRET_KEY
          user: $USER_VPS
          dest-path: $DEST_PATH
          docker-registry: ghcr.io
          docker-password: ${{ secrets.TOKEN_PACKAGES_GITHUB }}


      
            
          
