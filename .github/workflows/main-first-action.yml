name: ma premiere action

on: push

# Declaration des variables avec un scope global
env:
  VAR_1: from workflow

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "lancer le linter"

  release:
    if: ${{ github.ref == 'refs/heads/release' }}
    env: 
      VAR_2: from step release
    runs-on: ubuntu-latest

    steps:
      - run: echo "on fait un release"
  
  deploy:
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - run: echo "on fait un deploiement"
