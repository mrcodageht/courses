name: ma premiere action

on: 
  push:
    branches:
      - 'main'
      - 'dev'
      - 'release/**'

env:
  VERSION: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
  
    steps:
      - name: recuperation depot git
        uses: actions/checkout@v4

      - name: Verifier la version
        id: step-validation
        if: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/release/**"]'), github.ref) }}
        run: |
          FILE_VERSION=$(cat VERSION)
          [ $VERSION == $FILE_VERSION ] && echo ::error::la version n\'a pas ete incrementee && exit 1
      
      


      - name: Installation des deps
        run: echo "on lance npm install"
        

  release:
    needs: build
    if: ${{ github.ref == 'refs/heads/release' }}
    env: 
      VAR_2: from step release
    runs-on: ubuntu-latest

    steps:
      - run: echo "on fait un release"
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - run: echo "on fait un deploiement"
