name: ma premiere action

on: 
  push:
    branches:
      - 'main'
      - 'dev'
      - 'release/**'

env:
  VERSION: 1.0.2

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest
  
    steps:
      - name: recuperation depot git
        uses: actions/checkout@v4

      - name: Verifier la version
        id: step-validation
        if: ${{ contains(fromJSON('["refs/heads/main", "refs/heads/release/**"]'), github.ref) }}
        run: |
          FILE_VERSION=$(cat VERSION)
          [ $VERSION == $FILE_VERSION ] && echo ::error::la version n\'a pas ete incrementee || echo ''
          [ $VERSION == $FILE_VERSION ] && exit 1 || exit 0
          
          echo "$VERSION" > VERSION

          git config --global user.email "workflow@mrccommunity.com"
          git config --global user.name "From Workflow"
          
          git add VERSION
          git commit -m "Mise a jour du fichier VERSION"
          git push origin HEAD:main


      - name: Installation des deps
        run: echo "on lance npm install"
        

  release:
    needs: build
    if: ${{ github.ref == 'refs/heads/release' }}
    env: 
      VAR_2: from step release
    runs-on: ubuntu-latest

    steps:
      - run: echo "on fait un release"
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - run: echo "on fait un deploiement"
