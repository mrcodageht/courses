name: Utilisation d'action perso

on: 
  push:
    branches: ['main']
  
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
        - run: echo mise a jour du projet ${{ github.repository }}
        - name: utilisation d'une action
          uses: mrcodageht/courses/.github/actions/deploy@main
        
        - uses: tailscale/github-action@v4
          with:
            oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
            oauth-secret: ${{secrets.TS_OAUTH_CLIENT_SECRET}}
            tags: tag:workflow
        
        - name: checkout du repo
          uses: actions/checkout@v6

        - uses: mrcodageht/courses/.github/actions/deploy@main
          with:
            use-tailscale: true
            host: 'vpn'
            secret-key: ${{ secrets.SSH_KEY_VPS }}
            user: ${{ vars.VPS_USER }}
            dest-path: '/home/${{ vars.VPS_USER }}'


          

